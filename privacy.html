<title>personal-sync – Privacy Policy</title>
<h1>Privacy Policy</h1>
<p>personal-sync is used only by its owner. It uses the Google Drive scope <code>drive.file</code>, so it can access only the files it creates itself.</p>
<p>No data is shared with third parties or used for any other purpose. Access can be revoked at <a href="https://myaccount.google.com/permissions">myaccount.google.com/permissions</a>.</p>
